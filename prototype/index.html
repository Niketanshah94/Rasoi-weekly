<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rasoi: V1 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F1F4F0; --surface:#FFFFFF; --surface-2:#E7ECE6; --ink:#1B2620; --muted:#55645A; --line:#D3DBD3;
  --leaf:#2E6A3E; --leaf-ink:#FFFFFF; --leaf-soft:#DCEBDD;
  --turmeric:#E3A21A; --turmeric-soft:#FBEFD2;
  --chili:#C0432F; --chili-soft:#F8E0DA;
  --veg:#13853A; --egg:#A86F00; --nonveg:#A3341F;
  --scrim:rgba(10,16,12,.45);
  --display:"Bricolage Grotesque","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hindi:"Noto Sans Devanagari","Figtree",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111713; --surface:#1A221D; --surface-2:#232D27; --ink:#E8EEE9; --muted:#A3B3A8; --line:#2F3B34;
    --leaf:#7CC48F; --leaf-ink:#0E1A12; --leaf-soft:#22382A;
    --turmeric:#F0B43A; --turmeric-soft:#3A2F17;
    --chili:#EE7A64; --chili-soft:#43251F;
    --veg:#4CC46B; --egg:#F0B43A; --nonveg:#F07A5F;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111713; --surface:#1A221D; --surface-2:#232D27; --ink:#E8EEE9; --muted:#A3B3A8; --line:#2F3B34;
  --leaf:#7CC48F; --leaf-ink:#0E1A12; --leaf-soft:#22382A;
  --turmeric:#F0B43A; --turmeric-soft:#3A2F17;
  --chili:#EE7A64; --chili-soft:#43251F;
  --veg:#4CC46B; --egg:#F0B43A; --nonveg:#F07A5F;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
[lang="hi"]{font-family:var(--hindi)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
h1,h2,h3{margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding:14px 16px 10px;max-width:480px;margin:0 auto}
.brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.proto{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--turmeric-soft);color:var(--ink)}
.week{font-size:14px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.days[hidden]{display:none}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 0 6px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .dname{font-size:12px;color:var(--muted)}
.day .dnum{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1}
.day .today{width:5px;height:5px;border-radius:50%;background:var(--turmeric);margin-top:2px}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.day[aria-pressed="true"] .dname{color:var(--ground);opacity:.8}

/* Layout */
main{max-width:480px;margin:0 auto;padding:6px 16px 100px}
section[hidden]{display:none}
.block{margin-top:18px}
.block-title{font-size:15px;font-weight:600;margin-bottom:8px}

/* Food preference */
.diets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diet{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:60px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px}
.diet-name{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
.diet small{font-size:12px;color:var(--muted);line-height:1.3}
.diet[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.mark{display:inline-grid;place-items:center;width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;flex:none}
.mark::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.mark-veg{color:var(--veg)} .mark-egg{color:var(--egg)} .mark-nonveg{color:var(--nonveg)}
.mark-nonveg::after{width:0;height:0;border-radius:0;background:none;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid currentColor}
.avoid-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.avoid-label{font-size:14px;color:var(--muted)}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:40px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* Plans */
.plans{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.plans::-webkit-scrollbar{display:none}
.plan{flex:0 0 68%;scroll-snap-align:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;min-height:76px}
.plan b{display:block;font-family:var(--display);font-weight:600;font-size:17px}
.plan span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.plan[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

/* Plate */
.plate{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.plate-top{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.plate svg{width:132px;height:132px;display:block}
.plate h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.macros{display:grid;grid-template-columns:repeat(2,auto);justify-content:start;gap:6px 20px;margin-top:8px}
.macros b{font-family:var(--display);font-weight:600;font-size:18px;display:block;line-height:1.1}
.macros span{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.praise{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:15px}
.hstatus{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:16px}
.hstatus i{width:12px;height:12px;border-radius:50%;background:var(--st)}
.hchecks{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.hchecks li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hc-name{font-size:14px;font-weight:600}
.hc-val{font-size:14px;font-variant-numeric:tabular-nums}
.hc-val small{display:block;font-size:12px;color:var(--muted)}
.hc-state{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--ink);white-space:nowrap}
.hc-ok{background:var(--leaf-soft)} .hc-low{background:var(--turmeric-soft)} .hc-high{background:var(--chili-soft)}
.hchecks + .praise{border-top:0;padding-top:0}
.hfix{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-size:14px;line-height:1.45}
.hfix .btn{flex:none}
.hweek{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.hweek-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.hday{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid transparent;background:none;border-radius:12px;padding:6px 0;min-height:48px;font-size:11.5px;color:var(--muted)}
.hday i{width:16px;height:16px;border-radius:50%;background:var(--st)}
.hday.sel{border-color:var(--ink);color:var(--ink);font-weight:700}

/* Timeline */
.meals{list-style:none;margin:0;padding:0;position:relative}
.meals::before{content:"";position:absolute;left:71px;top:18px;bottom:18px;width:2px;background:var(--line)}
.meals li+li{margin-top:8px}
.meal{width:100%;display:grid;grid-template-columns:56px 18px 1fr 30px;gap:0 8px;align-items:center;text-align:left;background:transparent;border:0;padding:6px 0;border-radius:16px}
.meal .time{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.meal .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ground);justify-self:center;position:relative;z-index:1}
.meal .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-height:64px}
.meal .slot{font-size:12px;color:var(--muted)}
.meal .dish{display:block;font-weight:600;font-size:16px;line-height:1.25;margin-top:1px}
.meal .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.meal .check{width:28px;height:28px}
.meal[data-cooked="true"] .dish{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--muted)}
.meal:hover .card{border-color:var(--muted)}
.dish .mark,.swap-name .mark,.lib-name .mark{margin-right:7px;vertical-align:-1px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;color:var(--ink)}
.tag i{width:7px;height:7px;border-radius:50%}
.tag-healthy{background:var(--leaf-soft)} .tag-healthy i{background:var(--leaf)}
.tag-comfort{background:var(--turmeric-soft)} .tag-comfort i{background:var(--turmeric)}
.tag-treat{background:var(--chili-soft)} .tag-treat i{background:var(--chili)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink)}

/* Buttons */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;min-height:48px;font-weight:600;font-size:15px}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn.wide{width:100%;margin-top:18px}
.linkbtn{border:0;background:none;padding:0;color:var(--leaf);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px;min-height:24px}

/* Dishes library */
.lib-head h2,.g-head h2,.cook-head h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.lib-head p,.g-head p,.cook-head p{margin-top:4px;font-size:14px}
.search-row{display:flex;gap:8px;margin-top:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;min-height:48px;min-width:0}
.search:focus-within{border-color:var(--ink)}
.search svg,.filter-btn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.search svg{color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);min-width:0;padding:10px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.filter-btn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;min-height:48px;font-weight:600;font-size:15px;flex:none}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--leaf);color:var(--leaf-ink);font-size:12px;padding:0 6px}
.results-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:16px}
.results-head p{font-size:15px}
.results-head .hh{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.sort select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:40px}
.lib-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.lib-card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:block}
.lib-card:hover{border-color:var(--muted)}
.lib-name{display:block;font-weight:600;font-size:16px;line-height:1.3}
.lib-hi{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.lib-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
.empty{text-align:center;padding:28px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;margin-top:12px}
.empty .btn{margin-top:12px}

/* Groceries */
.stepper-row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:44px;height:40px;border:0;background:transparent;font-size:20px;border-radius:999px}
.stepper output{min-width:24px;text-align:center;font-weight:700;font-family:var(--display);font-size:18px}
.progress{margin-top:14px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .3s}
.progress p{font-size:13px;color:var(--muted);margin-top:6px}
.g-group{margin-top:18px}
.g-group h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.g-group ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.g-group li+li{border-top:1px solid var(--line)}
.g-group label{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:11px 14px;min-height:48px;cursor:pointer}
.g-group input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.g-qty{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.g-group input:checked ~ .g-name{text-decoration:line-through;color:var(--muted)}

/* Cook view */
.seg{display:inline-flex;margin-top:14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.cook-list{list-style:none;margin:16px 0 0;padding:0}
.cook-list>li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.cook-list>li+li{margin-top:10px}
.c-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.c-dish{display:block;font-size:24px;font-weight:600;line-height:1.25;margin-top:4px}
.c-dish .mark{width:18px;height:18px;margin-right:9px}
.c-meta{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.c-steps{margin-top:8px}
.c-steps summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--leaf);min-height:40px;display:flex;align-items:center}
.c-steps ol{margin:4px 0 0;padding-left:22px}
.c-steps li{font-size:16px;line-height:1.5;padding:3px 0}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--leaf)}

/* Sheet */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:480px;max-height:88vh;max-height:88dvh;border:0;padding:0;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink);overflow:auto}
dialog.sheet::backdrop{background:var(--scrim)}
.sheet-inner{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-slot{font-size:14px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet-title{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.sheet-hi{font-size:17px;color:var(--muted);margin-top:4px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.diet-label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-right:2px}
.timing{margin-top:10px;font-size:14px;color:var(--muted)}
.nutri{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.nutri div{background:var(--surface-2);border-radius:12px;padding:9px 4px;text-align:center}
.nutri b{display:block;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1}
.nutri span{font-size:11.5px;color:var(--muted)}
.contains{margin-top:12px;font-size:14px}
.warn{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--chili-soft);font-size:14px}
.sheet h3{font-size:15px;font-weight:600;margin-top:20px}
.ing{list-style:none;margin:8px 0 0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.steps{margin:8px 0 0;padding-left:22px}
.steps li{padding:4px 0;font-size:15px;line-height:1.5}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.sheet-actions.stack{grid-template-columns:1fr}
.swap{list-style:none;margin:12px 0 0;padding:0}
.swap li+li{margin-top:8px}
.swap-opt{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:block}
.swap-opt[aria-current="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.swap-name{display:block;font-weight:600}
.swap-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.fgroup{border:0;margin:18px 0 0;padding:0;min-width:0}
.fgroup legend{font-weight:600;font-size:15px;margin-bottom:8px;padding:0}
.sheet-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:20px -20px 0;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 2fr;gap:10px;border-top:1px solid var(--line)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);width:calc(100% - 32px);max-width:440px;background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;z-index:20;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: no-preference){
  dialog.sheet[open]{animation:sheetUp .22s ease-out}
  @keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion: reduce){
  .toast,.bar i{transition:none}
}
@media (max-width:360px){
  .plate-top{grid-template-columns:1fr;justify-items:center;text-align:center}
  .macros,.legend{justify-content:center}
  .nutri{grid-template-columns:repeat(3,1fr)}
}

/* ===== V1 flow additions ===== */
.brand-row{align-items:center}
.top-right{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--leaf);color:var(--leaf-ink);font-weight:700;font-family:var(--display);font-size:17px;display:grid;place-items:center;flex:none}
.avatar.big{width:56px;height:56px;font-size:22px}
.center{text-align:center}
.fine{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5}
.btn.big{min-height:54px;font-size:16px;border-radius:16px}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.danger{background:var(--chili);border-color:var(--chili);color:var(--surface)}
.btn-ic,.chev,.lock-ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-ic{width:20px;height:20px;vertical-align:-4px;margin-right:8px}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.linkbtn.block{display:block;margin:14px auto 0;font-size:14px;min-height:40px}
.proto-note{margin-top:14px;padding:8px 12px;border:1.5px dashed var(--turmeric);border-radius:12px;font-size:13px;background:var(--turmeric-soft);color:var(--ink)}
.note{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;line-height:1.5}
.note .diet-label{margin-right:6px}
.pair{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:4px;color:var(--ink)}
.pair .mark{width:12px;height:12px}
.pair .mark::after{width:5px;height:5px}
.pair .mark-nonveg::after{width:0;height:0;border-left-width:3px;border-right-width:3px;border-bottom-width:6px}

/* Screens: auth, onboarding, paywall */
.screen{max-width:480px;margin:0 auto;padding:12px 20px 150px}
.s-head{display:flex;align-items:center;gap:12px;min-height:48px}
.s-title{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em;margin-top:18px}
.s-sub{color:var(--muted);margin-top:8px;font-size:16px}
.field{display:block;margin-top:20px}
.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px}
.input:focus{outline:none;border-color:var(--ink)}
.input::placeholder,.phone-in input::placeholder{color:var(--muted);opacity:.8}
.phone-in{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;min-height:56px}
.phone-in:focus-within{border-color:var(--ink)}
.phone-in>span{padding:0 2px 0 14px;font-size:18px;font-weight:600;color:var(--muted)}
.phone-in input{flex:1;border:0;background:transparent;font:inherit;font-size:20px;letter-spacing:.04em;color:var(--ink);padding:12px 14px 12px 6px;min-width:0;outline:none}
.otp-input{font-family:var(--display);font-size:30px;letter-spacing:.45em;text-align:center;padding-left:.45em}
.err{color:var(--chili);font-size:14px;margin-top:8px;font-weight:600}
.err[hidden]{display:none}
.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress-onb{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1}
.progress-onb i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .3s}
.options{display:grid;gap:10px;margin-top:20px}
.option{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:64px}
.option b{display:block;font-size:16px}
.option span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.option[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.rows{margin-top:12px}
.row-step{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row-step b{display:block;font-weight:600;font-size:15px}
.row-step p span{display:block;font-size:13px;color:var(--muted)}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.cta-bar{position:fixed;left:0;right:0;bottom:0;background:var(--ground);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:6}
.cta-bar-inner{max-width:440px;margin:0 auto}
.cta-bar .btn.wide{margin-top:0}
.cta-bar .fine{margin-top:8px;text-align:center}
.section-label{font-size:15px;font-weight:600;margin-top:24px;margin-bottom:8px}
.seg-wide{display:flex}
.seg-wide button{flex:1}

/* Paywall */
.trial-tl{list-style:none;margin:22px 0 0;padding:0;position:relative}
.trial-tl::before{content:"";position:absolute;left:9px;top:10px;bottom:22px;width:2px;background:var(--line)}
.trial-tl li{position:relative;padding:0 0 16px 34px}
.trial-tl li::before{content:"";position:absolute;left:2px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--ground);border:2.5px solid var(--muted)}
.trial-tl li.now::before{background:var(--leaf);border-color:var(--leaf)}
.trial-tl li.charge::before{background:var(--turmeric);border-color:var(--turmeric)}
.trial-tl b{display:block;font-size:15px}
.trial-tl span{display:block;font-size:14px;color:var(--muted)}
.pay-plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pay-plan{display:block;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;position:relative;min-height:96px}
.pay-plan[aria-checked="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.pp-name{display:block;font-size:14px;font-weight:600}
.pp-price{display:block;font-family:var(--display);font-weight:800;font-size:26px;margin-top:4px;line-height:1.1}
.pp-note{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.pp-usd{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-top:4px}
.save-tag{position:absolute;top:-10px;right:10px;font-size:11.5px;font-weight:700;background:var(--turmeric);color:#1B2620;padding:2px 8px;border-radius:999px}
.methods{display:grid;gap:8px}
.method{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:60px;width:100%}
.method[aria-checked="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
[aria-checked="true"] .radio{border-color:var(--leaf)}
[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--leaf)}
.method b{display:block;font-size:15px}
.method small{display:block;font-size:13px;color:var(--muted)}
.rec{font-size:12px;font-weight:700;color:var(--leaf);margin-left:auto}
.perks{list-style:none;margin:16px 0 0;padding:0}
.perks li{position:relative;padding:6px 0 6px 28px;font-size:15px}
.perks li::before{content:"";position:absolute;left:2px;top:11px;width:12px;height:7px;border-left:2.5px solid var(--leaf);border-bottom:2.5px solid var(--leaf);transform:rotate(-45deg)}
.perks.plain li::before{width:7px;height:7px;border:0;border-radius:50%;background:var(--muted);transform:none;top:14px;left:4px}
.kv{margin:14px 0 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14px}
.kv li+li{border-top:1px solid var(--line)}
.kv li span:first-child{color:var(--muted)}
.kv li span:last-child{text-align:right;font-weight:600}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--leaf);animation:spin .9s linear infinite;margin:20px auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
.big-check{width:72px;height:72px;display:block;margin:12px auto 0}
.welcome{padding-top:48px}
.welcome .note{text-align:left}

/* App extras */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4}
.banner-info{background:var(--leaf-soft)}
.banner-warn{background:var(--turmeric-soft)}
.banner-bad{background:var(--chili-soft)}
.banner .linkbtn{font-size:14px;flex:none}
.hh-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.hh-card b{display:flex;align-items:center;gap:6px;font-size:15px;flex-wrap:wrap}
.hh-card span.sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lock{margin-top:24px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px}
.lock-ic{width:40px;height:40px;color:var(--leaf)}
.lock h2{font-family:var(--display);font-weight:800;font-size:24px;margin-top:10px;letter-spacing:-.01em}
.lock p{color:var(--muted);margin:8px auto 0;max-width:34ch}
.cook-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.wa{margin-top:14px;background:var(--surface-2);border-radius:16px;padding:14px}
.wa-to{font-size:13px;color:var(--muted)}
.wa-bubble{margin-top:8px;background:var(--leaf-soft);border-radius:14px 14px 4px 14px;padding:12px 14px;white-space:pre-wrap;font-size:15px;line-height:1.55}
.wa-bubble.scroll{max-height:40vh;overflow:auto}
.bazaar-actions{margin-top:16px}
.bazaar-actions .btn.wide{margin-top:0}
.cm-dots{display:flex;gap:6px;margin-top:14px}
.cm-dots i{flex:1;height:5px;border-radius:999px;background:var(--surface-2)}
.cm-dots i.on{background:var(--leaf)}
.cm-count{font-size:14px;color:var(--muted);margin-top:16px}
.cm-step{font-size:23px;line-height:1.45;font-weight:500;margin-top:6px;min-height:6.5em}

/* Account */
.a-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:480px;margin:0 auto}
.a-top h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.acc{max-width:480px;margin:0 auto;padding:4px 16px 56px}
.acc.with-cta{padding-bottom:140px}
.profile{display:flex;align-items:center;gap:14px;margin-top:8px}
.profile b{display:block;font-size:19px}
.profile span{color:var(--muted);font-size:14px}
.sub-card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.status{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--ink)}
.status-trial,.status-active{background:var(--leaf-soft)}
.status-cancel{background:var(--turmeric-soft)}
.status-bad{background:var(--chili-soft)}
.status-none{background:var(--surface-2)}
.sub-card h2{font-family:var(--display);font-weight:600;font-size:21px;margin-top:8px}
.sub-card p{color:var(--muted);font-size:14px;margin-top:4px}
.sub-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.list{margin-top:22px}
.list h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.list ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;min-height:56px;font-size:15px;color:var(--ink)}
.lrow>span{flex:1;min-width:0}
.lrow small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.lrow.danger{color:var(--chili);font-weight:600}
div.lrow{cursor:default}
.legal{max-width:480px;margin:0 auto;padding:4px 20px 56px}
.legal h2{font-family:var(--display);font-weight:600;font-size:19px;margin-top:22px}
.legal p,.legal li{font-size:15px;line-height:1.6;margin-top:6px}
.legal ul{padding-left:20px;margin:6px 0 0}

/* Landing */
.landing{max-width:560px;margin:0 auto;padding:0 20px 48px}
.l-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand-word{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.hero{padding:22px 0 0}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,11.5vw,60px);line-height:.98;letter-spacing:-.035em}
.lede{font-size:18px;color:var(--muted);margin-top:16px;max-width:36ch}
.hero .btn{margin-top:24px}
.preview{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 16px 6px}
.preview-head{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.preview-head b{color:var(--ink);font-weight:600}
.pv-list{list-style:none;margin:10px 0 0;padding:0}
.pv-list li{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.pv-time{font-size:13px;color:var(--muted);padding-top:1px}
.pv-dish{display:block;font-weight:600;font-size:15px}
.pv-dish .mark{margin-right:7px;vertical-align:-1px}
.l-sec{margin-top:44px}
.l-sec h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.how{list-style:none;counter-reset:s;margin:14px 0 0;padding:0}
.how li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.how li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:30px;color:var(--leaf);line-height:1}
.how b{display:block;font-size:17px}
.how li>span>span{display:block;color:var(--muted);font-size:15px;margin-top:3px}
.faq details{border-top:1px solid var(--line);padding:12px 0}
.faq summary{font-weight:600;cursor:pointer;min-height:32px}
.faq p{color:var(--muted);margin-top:6px}
.l-foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px}
.l-foot .linkbtn{font-size:14px;min-height:36px}
select.input{appearance:auto}

/* Prototype controls and notifications */
.demo-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:30;writing-mode:vertical-rl;padding:12px 7px;border:1.5px dashed var(--turmeric);border-right:0;border-radius:10px 0 0 10px;background:var(--turmeric-soft);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.02em}
.demo-group{margin-top:18px}
.demo-group h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-grid .btn{min-height:46px;font-size:14px;padding:8px 10px}
.notif{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-160%);width:calc(100% - 24px);max-width:440px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:40;transition:transform .3s;cursor:pointer}
.notif.show{transform:translate(-50%,0)}
.notif-app{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.notif-app i{width:18px;height:18px;border-radius:5px;background:var(--leaf);display:inline-block}
.notif b{display:block;margin-top:4px;font-size:15px}
.notif p{font-size:14px;margin-top:2px}
@media (prefers-reduced-motion: reduce){ .notif,.switch span,.progress-onb i{transition:none} .spinner{animation-duration:2.4s} }

/* ===== Admin panel ===== */
body[data-view="admin"]::before{background:var(--ink)}
.adm-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--ground)}
.adm-top-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.adm-brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.adm-brand small{font-family:var(--body);font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--turmeric);color:#1B2620;margin-left:8px;vertical-align:3px}
.adm-top .adm-ghost{background:transparent;color:var(--ground);border-color:color-mix(in srgb,var(--ground) 45%,transparent)}
.adm-av{width:34px;height:34px;font-size:14px;background:var(--turmeric);color:#1B2620}
.adm-nav{max-width:1040px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.adm-nav::-webkit-scrollbar{display:none}
.adm-nav button{flex:none;border:0;background:transparent;color:var(--ground);opacity:.8;font-weight:600;font-size:14px;padding:8px 13px;border-radius:999px;min-height:40px}
.adm-nav button[aria-current="page"]{background:var(--ground);color:var(--ink);opacity:1}
.adm{max-width:1040px;margin:0 auto;padding:18px 16px 130px}
.adm h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.adm-sub{color:var(--muted);font-size:14px;margin-top:4px}
.ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ahead .linkbtn{font-size:14px;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--display);font-weight:600;font-size:26px;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.acards .acard{margin-top:0}
.acard h2{font-size:16px;font-weight:700}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.cbars{list-style:none;margin:10px 0 0;padding:0}
.cbars li{display:grid;grid-template-columns:minmax(90px,130px) 1fr 32px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.cbars b{text-align:right;font-variant-numeric:tabular-nums}
.cbar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--leaf-soft);box-shadow:inset 0 0 0 1px var(--leaf)}
.cbar i.pay{background:var(--leaf);box-shadow:none}
.mini-list{list-style:none;margin:10px 0 0;padding:0}
.mini-list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.arow-list{list-style:none;margin:10px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.arow-list li+li{border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px;min-height:60px;color:var(--ink)}
button.arow:hover{background:var(--surface-2)}
.arow b{font-size:15px;font-weight:600}
.arow b .mark{vertical-align:-1px}
.arow small{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.45}
.tagdev{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--turmeric-soft);color:var(--ink);margin-left:6px;vertical-align:1px}
.atools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.atools .search{flex:1 1 220px}
.aselect{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:48px}
.agrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.agrid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0 10px}
.ing-row{display:grid;grid-template-columns:1fr 84px 44px 44px;gap:8px;align-items:center;margin-top:8px}
.ing-row .input{min-height:46px;font-size:15px;padding:8px 10px}
.step-row{display:grid;grid-template-columns:22px 1fr 44px;gap:8px;align-items:start;margin-top:8px}
textarea.input{min-height:64px;resize:vertical;font-size:15px;line-height:1.45}
.derived{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.5}
.warn ul{margin:6px 0 0;padding-left:20px}
.pday-row{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.pday-row .input{min-height:46px;font-size:15px;padding:8px 10px}
.pday-row b{font-size:14px}
.tscroll{overflow-x:auto;margin-top:8px}
.atable{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.atable th,.atable td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.atable thead th{font-size:12px;color:var(--muted);font-weight:600}
.adm-actions{display:flex;gap:10px;justify-content:flex-end}
.adm-actions .btn{flex:1;max-width:220px}
.btn.danger-outline{color:var(--chili);border-color:var(--chili)}
.alogin{max-width:420px;margin:0 auto;padding:72px 20px 40px;text-align:center}
.alogin .lock-ic{width:44px;height:44px;color:var(--leaf)}
</style>

function deriveDish(r){
  const al=new Set(); let diet="veg";
  Object.keys(r.ing).forEach(k=>{ const g=ING[k]; if(!g) return; (g[3]||"").split("").forEach(a=>al.add(a)); if(g[2]===MEAT) diet="nonveg"; else if(k==="eggs"&&diet!=="nonveg") diet="egg"; });
  const [kcal,p,c,f,fib]=r.nut;
  return {id:r.id,n:r.n,hi:r.hi||"",slots:r.sl.split(""),tag:{h:"healthy",c:"comfort",t:"treat"}[r.mood],mood:r.mood,cu:r.cu,prep:r.prep,cook:r.cook,min:r.prep+r.cook,lvl:r.lvl,spice:r.spice,kcal,p,c,f,fib,ing:r.ing,steps:r.steps,al:[...al],diet,cc:[...new Set(r.cc.split(","))]};
}
const dishRecord=id=>ADM.dishes[id]||BASE_DISHES[id];
const dishStatus=id=>ADM.status[id]||(BASE_DISHES[id]?"published":"draft");
function rebuildDishes(){
  Object.keys(DISHES).forEach(k=>delete DISHES[k]);
  new Set(Object.keys(BASE_DISHES).concat(Object.keys(ADM.dishes))).forEach(id=>{ DISHES[id]=deriveDish(dishRecord(id)); });
}

  if(u==="g"||u==="ml"){ if(q>=1000){ const v=Math.round(q/100)/10; return `${v} ${u==="g"?"kg":"L"}`; } const r=q<100?Math.ceil(q/5)*5:Math.ceil(q/10)*10; return `${r} ${u}`; }
  if(exact&&u==="bunch"&&q<=.3) return "a few sprigs";
  if(exact&&(u==="pcs"||u==="bunch")){ const r=Math.max(.25,Math.round(q*4)/4), w=Math.floor(r), fr=FRAC[r-w]||""; const txt=(w?String(w):"")+fr; return u==="pcs"?txt:`${txt} ${r>1?"bunches":"bunch"}`; }
  const n=Math.max(1,Math.ceil(q-1e-9)); if(u==="pcs") return `${n}`; const [one,many]=UNITS[u]; return `${n} ${n===1?one:many}`;
}

/* Healthy-day check: general targets for an average adult, per person per day */
const TARGETS={kcalMin:1600,kcalMax:2400,p:50,fib:25,fatPct:35,carbMin:45,carbMax:65};
function dayTotals(day,swap){
  return SLOTS.reduce((a,s)=>{ const d=DISHES[swap&&swap.slot===s.id?swap.id:dishId(day,s.id)]; return {kcal:a.kcal+d.kcal,p:a.p+d.p,c:a.c+d.c,f:a.f+d.f,fib:a.fib+d.fib}; },{kcal:0,p:0,c:0,f:0,fib:0});
}
function healthChecks(t){
  const T=TARGETS, fatPct=Math.round(t.f*9/t.kcal*100), carbPct=Math.round(t.c*4/t.kcal*100), n=v=>v.toLocaleString("en-IN");
  return [
    {label:"Calories",val:`${n(t.kcal)} kcal`,target:`${n(T.kcalMin)}–${n(T.kcalMax)}`,state:t.kcal<T.kcalMin?"low":t.kcal>T.kcalMax?"high":"ok"},
    {label:"Protein",val:`${t.p} g`,target:`${T.p} g or more`,state:t.p<T.p?"low":"ok"},
    {label:"Fibre",val:`${t.fib} g`,target:`${T.fib} g or more`,state:t.fib<T.fib?"low":"ok"},
    {label:"Fat",val:`${fatPct}% of calories`,target:`${T.fatPct}% or less`,state:fatPct>T.fatPct?"high":"ok"},
    {label:"Carbs",val:`${carbPct}% of calories`,target:`${T.carbMin}–${T.carbMax}%`,state:carbPct<T.carbMin?"low":carbPct>T.carbMax?"high":"ok"}
  ];

const healthScore=t=>healthChecks(t).filter(c=>c.state==="ok").length;
const healthStatus=n=>n===5?{id:"good",label:"Healthy day",color:"var(--leaf)"}:n===4?{id:"near",label:"Nearly balanced",color:"var(--turmeric)"}:{id:"off",label:"Unbalanced day",color:"var(--chili)"};
// The one swap that meets the most extra targets while changing the day the least
function bestFix(day){
  const base=healthScore(dayTotals(day)); if(base===5) return null;
  const today=SLOTS.map(s=>dishId(day,s.id)); let best=null;
  for(const s of SLOTS){ const cur=dishId(day,s.id);
    for(const id of Object.keys(DISHES)){
      if(id===cur||today.includes(id)||!DISHES[id].slots.includes(s.id)||!allowed(id)) continue;
      const sc=healthScore(dayTotals(day,{slot:s.id,id})); if(sc<=base) continue;
      const cost=Math.abs(DISHES[id].kcal-DISHES[cur].kcal)+(DISHES[id].tag===DISHES[cur].tag?0:60);
      if(!best||sc>best.sc||(sc===best.sc&&cost<best.cost)) best={slot:s.id,id,cur,sc,cost};
    }
  }
  return best;
}
function healthLine(t,checks,ds){

  if(n===5) return t.p>=85?`All five targets met, with ${t.p} g of protein. Great planning.`:"All five targets met. A well-balanced day, nicely planned.";
  const off=checks.filter(c=>c.state!=="ok").map(c=>`${c.label.toLowerCase()} ${c.state==="low"?"is low":"is high"}`);
  const list=off.length>1?off.slice(0,-1).join(", ")+" and "+off[off.length-1]:off[0];
  return `${list.charAt(0).toUpperCase()+list.slice(1)}.${treats>=2?" Treat days happen; it’s the week that counts.":""}`;
}

    <p class="small muted" style="margin-top:6px">Per serving, approximate.</p>
    <p class="contains">${contains}</p>${extra}
    <h3>Raw items for ${forWho}</h3>
    <ul class="ing">${Object.entries(d.ing).map(([k,q])=>`<li><span>${esc(ingName(k))}</span><span>${fmtQty(q*mult,ING[k][1],true)}</span></li>`).join("")}</ul>
    <h3>How to make it</h3><ol class="steps">${d.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${actions}`;

/* Demo accounts, generated once with a fixed seed so numbers stay stable */
function seedUsers(){
  let seed=20261029; const rnd=()=>{ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; };
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const NAMES_BY={
    IN:["Aarav Mehta","Priya Iyer","Rohan Gupta","Ananya Rao","Vikram Singh","Kavya Nair","Arjun Desai","Meera Joshi","Siddharth Kapoor","Neha Agarwal","Rahul Verma","Isha Malhotra","Karan Shah","Pooja Reddy","Aditya Kulkarni","Divya Menon","Nikhil Bansal","Sneha Pillai","Varun Chawla","Ritu Saxena"],
    US:["Emily Carter","Jason Patel","Megan Brooks","Ravi Shankar","Ashley Nguyen","Daniel Kim","Sarah Johnson","Neil Bhatt"],
    GB:["Oliver Hughes","Amelia Clarke","Harpreet Kaur","James Wilson","Sophie Turner","Imran Qureshi"],
    AE:["Fatima Al Hashimi","Ahmed Al Mansouri","Deepa Krishnan","Omar Haddad","Sara Rahman","Anil Varghese"],
    SG:["Wei Ling Tan","Marcus Lim","Priyanka Raj","Hui Min Goh","Daniel Ong","Shalini Pillai"]};
  const users=[]; let n=0;
  [["IN",20],["US",8],["GB",6],["AE",6],["SG",6]].forEach(([cc,count])=>{
    for(let i=0;i<count;i++){
      const name=NAMES_BY[cc][i], joined=baseToday-Math.floor(rnd()*45)*DAY, age=Math.round((baseToday-joined)/DAY);
      const plan=rnd()<0.62?"monthly":"annual";
      let status; if(age<7) status=rnd()<0.85?"trialing":"cancelled"; else { const r=rnd(); status=r<0.55?"active":r<0.63?"past_due":r<0.82?"expired":r<0.9?"cancelled":"free"; }
      const people=2+Math.floor(rnd()*4), nonveg=Math.floor(rnd()*(people+1));
      const method=status==="free"?"":cc==="IN"?(rnd()<0.75?"upi":"card"):(rnd()<0.6?"card":"wallet");
      const trialEnd=status==="free"?null:joined+7*DAY, payments=[];
      if(["active","past_due","cancelled"].includes(status)&&age>=7){ let t=trialEnd; while(t<=baseToday){ payments.push({t,plan,usd:priceUSD(cc,plan)}); t=addPeriod(t,plan); } }
      let nextCharge=payments.length?addPeriod(payments[payments.length-1].t,plan):trialEnd;
      if(status==="past_due"&&payments.length){ nextCharge=payments.pop().t; }
      const u={id:"u"+(1001+n++),name,email:name.toLowerCase().replace(/[^a-z ]/g,"").trim().replace(/ +/g,".")+"@example.com",country:cc,joined,status,plan,method,
        people,nonveg,cooks:pick(["self","self","cook","both"]),style:pick(cPlans(cc)).id,phone:rnd()<0.5,payments,trialEnd,nextCharge,via:rnd()<0.6?"google":"email"};
      if(status==="cancelled") u.accessUntil=payments.length?nextCharge:trialEnd;
      users.push(u);
    }
  });
  return users;
}
function ensureSeed(){ if(!Array.isArray(ADM.users)){ ADM.users=seedUsers(); admSave(); } }
// The real account on this device, shaped like the demo accounts
function deviceUser(){
  if(!P.acct) return null; const a=P.acct, s=P.sub;
  let status=!s?"free":s.status; if(s&&s.status==="cancelled"&&!hasAccess()) status="expired";
  return {id:"device",device:true,name:a.name||"New user (no name yet)",email:a.email||"",country:a.country||"IN",joined:a.joined||baseToday,status,
    plan:s?s.plan:"monthly",method:s?s.method:"",people:a.people,nonveg:a.nonveg,cooks:a.cooks,style:a.plan,phone:!!a.phone,via:a.via||"email",
    payments:P.payments.slice().reverse().map(p=>({t:p.t,plan:p.plan,refunded:p.refunded,usd:priceUSD(a.country||"IN",p.plan)})),
    trialEnd:s&&s.trialStart?s.trialStart+7*DAY:null,nextCharge:s?(s.status==="past_due"?s.failedAt:s.nextCharge||(s.trialStart?s.trialStart+7*DAY:null)):null,accessUntil:s&&s.accessUntil};
}
const allUsers=()=>[deviceUser()].filter(Boolean).concat(ADM.users||[]);
function kpis(us){
  const wk=baseToday-6*DAY, m30=baseToday-29*DAY, paying=us.filter(u=>u.status==="active"||u.status==="past_due");
  const mrr=paying.reduce((a,u)=>a+(u.plan==="annual"?priceUSD(u.country,"annual")/12:priceUSD(u.country,"monthly")),0);
  const ended=us.filter(u=>u.trialEnd&&u.trialEnd<=baseToday), conv=ended.filter(u=>u.payments.length>0).length;
  const rev30=us.reduce((a,u)=>a+u.payments.filter(p=>p.t>=m30&&!p.refunded).reduce((b,p)=>b+(p.usd||priceUSD(u.country,p.plan)),0),0);
  return {total:us.length,newWeek:us.filter(u=>u.joined>=wk).length,trials:us.filter(u=>u.status==="trialing").length,paying:paying.length,
    failed:us.filter(u=>u.status==="past_due").length,mrr,conv:ended.length?Math.round(conv/ended.length*100):0,ended:ended.length,rev30};
}

function userAction(k){
  const id=U.ctx.uid, dev=id==="device", u=dev?null:(ADM.users||[]).find(x=>x.id===id);
  if(!dev&&!u) return; const s=dev?P.sub:null, name=dev?(P.acct&&P.acct.name)||"this device’s user":u.name;
  let msg="";
  switch(k){
    case "delete": U.ctx.confirm=true; paintSheet(); return;
    case "back": U.ctx.confirm=false; paintSheet(); return;
    case "extend": if(dev) s.trialStart+=7*DAY; else { u.trialEnd+=7*DAY; u.nextCharge=u.trialEnd; } msg=`Extended ${name}’s trial by 7 days.`; break;
    case "cancel": { const trial=dev?s.status==="trialing":u.status==="trialing";
      if(dev){ s.accessUntil=trial?chargeT():s.nextCharge; s.status="cancelled"; } else { u.accessUntil=trial?u.trialEnd:u.nextCharge; u.status="cancelled"; }
      msg=`Cancelled ${name}’s ${trial?"trial":"subscription"}.`; break; }
    case "freemonth": if(dev) s.nextCharge=addPeriod(s.nextCharge,"monthly"); else u.nextCharge=addPeriod(u.nextCharge,"monthly"); msg=`Gave ${name} a free month.`; break;
    case "remind": msg=`Sent ${name} a payment reminder.`; break;
    case "recover":
      if(dev){ s.status="active"; delete s.graceUntil; delete s.failedAt; s.nextCharge=addPeriod(nowT(),s.plan); addPayment(s.plan); }
      else { u.status="active"; u.payments.push({t:baseToday,plan:u.plan,usd:priceUSD(u.country,u.plan)}); u.nextCharge=addPeriod(baseToday,u.plan); }
      msg=`Marked ${name}’s payment as recovered.`; break;
    case "reactivate": if(dev){ s.status=s.nextCharge?"active":"trialing"; delete s.accessUntil; } else { u.status=u.payments.length?"active":"trialing"; delete u.accessUntil; } msg=`Reactivated ${name}’s subscription.`; break;
    case "winback": msg=`Queued a win-back offer for ${name}.`; break;
    case "refund":
      if(dev){ const p=P.payments.find(x=>!x.refunded); if(p) p.refunded=true; }
      else { const p=u.payments.slice().reverse().find(x=>!x.refunded); if(p) p.refunded=true; }
      msg=`Refunded ${name}’s last payment.`; break;
    case "resend": msg=`Sent a login link to ${dev?P.acct.email:u.email}.`; break;
    case "confirmdelete": if(dev){ P=fresh(); } else ADM.users=ADM.users.filter(x=>x.id!==id); msg=`Deleted ${name}’s account.`; break;
  }
  admLog(msg); save(); admSave();
  if(k==="confirmdelete") closeSheet(); else paintSheet();
  render(); toast(msg);
}

function saveDish(){
  const e=U.adm.edit, errs=[];
  e.n=e.n.trim(); if(!e.n) errs.push("Add a name in English.");
  if(!e.cc.length) errs.push("Pick at least one country.");
  if(!e.sl.length) errs.push("Pick at least one meal.");
  const ing=e.ing.filter(([k,q])=>ING[k]&&+q>0); if(!ing.length) errs.push("Add at least one ingredient with a quantity above zero.");
  const steps=e.steps.map(x=>String(x).trim()).filter(Boolean); if(!steps.length) errs.push("Add at least one cooking step.");
  const nut=e.nut.map(Number); if(nut.some(v=>!(v>=0))||!(nut[0]>0)) errs.push("Enter calories and the four nutrients as numbers.");
  if(!(+e.prep>=0)||!(+e.cook>=0)) errs.push("Enter prep and cook times in minutes.");
  e.errors=errs; if(errs.length){ render(); window.scrollTo(0,0); return; }
  const id=e.id||("x_"+e.n.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,16)+"_"+Date.now().toString(36).slice(-4));
  const ingObj={}; ing.forEach(([k,q])=>{ ingObj[k]=(ingObj[k]||0)+Number(q); });
  ADM.dishes[id]={id,n:e.n,hi:e.hi.trim(),sl:"blsdn".split("").filter(x=>e.sl.includes(x)).join(""),mood:e.mood,cu:e.cu,prep:+e.prep,cook:+e.cook,lvl:+e.lvl,spice:+e.spice,nut,ing:ingObj,steps,cc:e.cc.join(",")};
  ADM.status[id]=e.status;
  admLog(`${e.isNew?"Created":"Updated"} the dish “${e.n}” (${{published:"live",draft:"draft",hidden:"hidden"}[e.status]}).`);
  admSave(); applyAdmin(); U.adm.edit=null; render(); window.scrollTo(0,0);
  toast(e.status==="published"?`Saved. “${e.n}” is live in the app.`:`Saved. “${e.n}” is ${e.status==="draft"?"a draft":"hidden"}, so the app won’t show it.`);
}

/* ---------- Admin events ---------- */
function adminClick(ds){
  const A_=U.adm, e=A_.edit;
  if(ds.atab){ A_.tab=ds.atab; A_.edit=null; A_.plan=null; A_.pricing=null; render(); window.scrollTo(0,0); return true; }
  if(ds.auser){ openSheet({mode:"auser",uid:ds.auser}); return true; }
  if(ds.uact){ userAction(ds.uact); return true; }
  if(ds.adish){ openDishEdit(ds.adish); return true; }
  if(ds.aplan){ const p=PLANS.find(x=>x.id===ds.aplan); A_.plan={id:p.id,name:p.name,note:p.note,week:JSON.parse(JSON.stringify(p.week))}; A_.pday=0; render(); window.scrollTo(0,0); return true; }
  if(ds.apday!==undefined){ A_.pday=+ds.apday; rerender(); return true; }
  if(ds.aust){ A_.ust=ds.aust; rerender(); return true; }
  if(ds.adcc){ A_.dcc=ds.adcc; rerender(); return true; }
  if(e&&ds.astatus){ e.status=ds.astatus; rerender(); return true; }
  if(e&&ds.amood){ e.mood=ds.amood; rerender(); return true; }
  if(e&&ds.acc){ e.cc=e.cc.includes(ds.acc)?e.cc.filter(x=>x!==ds.acc):[...e.cc,ds.acc]; rerender(); return true; }

// Re-render while keeping keyboard focus on the same control.
function selFor(el){
  if(!el||el===document.body) return null; if(el.id) return "#"+el.id;
  const ks=Object.keys(el.dataset||{}); if(!ks.length) return null;
  return ks.map(k=>`[data-${k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}="${el.dataset[k]}"]`).join("");
}
function rerender(){ const sel=selFor(document.activeElement); render(); if(sel){ const e=document.querySelector(sel); if(e) e.focus(); } }
function repaintSheet(){ const sel=selFor(document.activeElement); paintSheet(); if(sel){ const e=sheetBody.querySelector(sel); if(e) e.focus(); } }

let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3000); }
let notifTimer;
function notify(title,text){ const n=$("#notif"); n.innerHTML=`<div class="notif-app"><i></i>${A()&&A().phone?"Rasoi on WhatsApp":"Email from Rasoi"}, now</div><b>${esc(title)}</b><p>${esc(text)}</p>`; n.classList.add("show"); clearTimeout(notifTimer); notifTimer=setTimeout(()=>n.classList.remove("show"),6000); }
function tickResend(){
  const el=$("#resend"); if(!el||U.view!=="otp") return;
  const left=Math.max(0,Math.ceil((U.resendAt-Date.now())/1000));
  el.innerHTML=left?`You can resend the link in 0:${String(left).padStart(2,"0")}`:`Didn’t get it? Check spam, or <button class="linkbtn" data-act="resend">resend the link</button>`;
}

  const e=U.email.toLowerCase();
  if(P.acct&&(P.acct.email||"").toLowerCase()===e){
    P.loggedIn=true; save();
    if(P.acct.onboarded){ U.tab="plan"; U.day=todayIdx(); go("app"); toast(`Welcome back${P.acct.name?", "+P.acct.name:""}.`); }
    else { U.onbStep=0; go("onb"); toast("Email confirmed. Let’s set up your kitchen."); }
    return;
  }
  P.acct=newAcct({email:U.email,via:"email",country:U.country,plan:firstPlan(U.country)}); resetData(); P.loggedIn=false; save();
  U.onbStep=0; go("onb"); toast("Email confirmed. Your account is active.");
}
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function finishOnboarding(){
  const a=A(); a.onboarded=true; P.loggedIn=true; if(a.cooks!=="self") P.lang=a.cookLang; save();
  U.payMode=trialUsed()?"subscribe":"trial"; U.payFrom="onb"; go("paywall");

function finalizePayment(){
  const m=U.mandate, ref=U.payMethod==="upi"?m.upi:U.payMethod==="wallet"?"wallet":m.card.replace(/\D/g,"").slice(-4);
  closeSheet();
  if(U.payMode==="trial"){
    P.sub={status:"trialing",plan:U.payPlan,method:U.payMethod,methodRef:ref,trialStart:nowT()}; save(); go("welcome");
  } else if(U.payMode==="subscribe"){
    P.sub=Object.assign({},P.sub||{},{status:"active",plan:U.payPlan,method:U.payMethod,methodRef:ref,nextCharge:addPeriod(nowT(),U.payPlan)});
    delete P.sub.accessUntil; addPayment(U.payPlan); save(); U.tab="plan"; go("app"); toast(`Subscribed. ${PR(U.payPlan).charge} paid; your invoice is in Account.`);
  } else {
    Object.assign(P.sub,{status:"active",method:U.payMethod,methodRef:ref,nextCharge:addPeriod(nowT(),P.sub.plan)});
    delete P.sub.graceUntil; delete P.sub.failedAt; addPayment(P.sub.plan); save(); go(U.payFrom==="account"?"account":"app"); toast("Payment successful. Your plan continues.");
  }
}
function ensureAcct(){ if(!P.acct){ P.acct=demoAcct(); P.acct.country=U.country; P.acct.plan=firstPlan(U.country); resetData(); } P.acct.onboarded=true; P.loggedIn=true; }
function ensureTrial(){ ensureAcct(); if(!P.sub||!P.sub.trialStart) P.sub={status:"trialing",plan:"monthly",method:CT().pay[0]==="upi"?"upi":"card",methodRef:CT().pay[0]==="upi"?"priya@okaxis":"4242",trialStart:nowT()}; }
function simDay(n){ P.offset=Math.round((P.sub.trialStart-baseToday)/DAY)+(n-1); }
function sim(k){
  ensureTrial(); const s=P.sub, pr=()=>PR(s.plan).charge, via=()=>({upi:"UPI AutoPay",card:"your card",wallet:"your wallet"})[s.method];
  delete s.graceUntil; delete s.accessUntil; delete s.failedAt;
  if(k==="day1"){ s.status="trialing"; delete s.nextCharge; P.payments=[]; simDay(1); }
  else if(k==="day5"){ s.status="trialing"; delete s.nextCharge; P.payments=[]; simDay(5); }
  else if(k==="day7"){ s.status="trialing"; delete s.nextCharge; P.payments=[]; simDay(7); }
  else if(k==="paid"){ simDay(8); s.status="active"; s.nextCharge=addPeriod(chargeT(),s.plan); addPayment(s.plan,chargeT()); }
  else if(k==="failed"){ simDay(8); s.status="past_due"; s.failedAt=chargeT(); s.graceUntil=chargeT()+3*DAY; }
  else if(k==="ended"){ simDay(8); s.status="expired"; delete s.nextCharge; }
  save(); closeSheet(); U.day=todayIdx(); U.tab="plan"; go("app");
  const msg={
    day5:["2 days left in your free trial",`Your first charge of ${pr()} is on ${fmt(chargeT())}. Enjoying your plans? No action needed. Cancel anytime in Account.`],
    day7:["Upcoming payment",`${pr()} will be charged on ${fmt(chargeT())} via ${via()} for your Rasoi ${PR(s.plan).name.toLowerCase()} plan. To stop it, cancel in Account.`],
    paid:["Payment received",`${pr()} paid. Your ${CT().invoice} ${P.payments[0]&&P.payments[0].inv} is in Account.`],
    failed:["Payment didn’t go through",`We couldn’t charge ${via()}. Update your payment method by ${fmt(chargeT()+3*DAY)} to keep your plan.`],
    ended:["Your free trial has ended","Recipes stay free. Subscribe anytime to keep planning your week."]
  }[k];
  if(msg) setTimeout(()=>notify(msg[0],msg[1]),250);
}
function jump(k){
  closeSheet();
  if(k==="admin") return go("admin");
  if(k==="landing") return go("landing");
  if(k==="auth"){ U.authMode="signup"; return go("auth"); }
  ensureAcct(); save();
  if(k==="onb"){ U.onbStep=0; return go("onb"); }
  if(k==="paywall"){ U.payMode=trialUsed()?"subscribe":"trial"; U.payFrom="app"; return go("paywall"); }
  if(k==="app"){ if(!P.sub){ ensureTrial(); save(); } U.tab="plan"; U.day=todayIdx(); return go("app"); }
  if(k==="account") return go("account");
}
function markCooked(slot){
  const k=key(U.day,slot);

}

    case "hhback": U.hh=null; go(U.hhFrom||"app"); break;
    case "savehh": { const h=U.hh; P.acct=h; U.hh=null; save(); go(U.hhFrom||"app"); toast("Household saved. Your week and shopping list are updated."); break; }
    case "planstyle": closeSheet(); U.tab="plan"; go("app"); toast("Pick a plan style under Weekly plan."); break;
    case "legalback": go(U.legalFrom||"landing"); break;
    case "eggs": { const t=tgt(); t.eggs=!t.eggs; if(U.view==="onb") save(); rerender(); break; }
    case "close": closeSheet(); break;
    case "swap": U.ctx.mode="swap"; U.ctx.swapF="all"; paintSheet(); sheet.scrollTop=0; break;
    case "back": U.ctx.mode="plan"; paintSheet(); sheet.scrollTop=0; break;
    case "filters": openSheet({mode:"filters"}); break;
    case "clearfilters": clearFilters(); if(sheet.open&&U.ctx.mode==="filters") paintSheet(); if(U.view==="app") render(); break;
    case "cook": { const on=markCooked(U.ctx.slot); if(on) closeSheet(); else paintSheet(); render(); break; }
    case "order": { const n=Object.keys(weekTotals()).filter(k=>!P.have[`${planId()}|${k}`]).length; toast(`In the full app, this fills your grocery app’s cart with ${n} ${plural(n,"item","items")}.`); break; }
    case "share": openSheet({mode:"share"}); break;
    case "bazaar": openSheet({mode:"bazaar",blang:P.lang}); break;
    case "bsend": toast("In the full app, this opens WhatsApp so you can pick anyone, like family or a helper, with the list filled in."); break;
    case "bcook": toast(`In the full app, this opens WhatsApp with ${A().cookName||"your cook"} (${CT().dial} ${fmtPhone(A().cookPhone)}) and the list filled in.`); break;
    case "bcopy": try{ navigator.clipboard.writeText(bazaarText(hindiList()?(U.ctx.blang||"en"):"en")).then(()=>toast(`${listName(true)} copied.`),()=>toast("Couldn’t copy here. Select the text instead.")); }catch(err){ toast("Couldn’t copy here. Select the text instead."); } break;
    case "sendwa": toast(`In the full app, this opens WhatsApp${A().cookPhone?" with "+CT().dial+" "+fmtPhone(A().cookPhone):""} with the menu filled in.`); break;
    case "copywa": try{ navigator.clipboard.writeText(shareText()).then(()=>toast("Menu copied."),()=>toast("Couldn’t copy here. Select the text instead.")); }catch(err){ toast("Couldn’t copy here. Select the text instead."); } break;
    case "cmprev": U.ctx.step=Math.max(0,(U.ctx.step||0)-1); repaintSheet(); break;
    case "cmnext": U.ctx.step=(U.ctx.step||0)+1; paintSheet(); { const b=sheetBody.querySelector('[data-act="cmnext"],[data-act="cmdone"]'); if(b) b.focus(); } break;
    case "cmdone": { const k=key(U.day,U.ctx.slot); closeSheet(); if(!P.cooked[k]) markCooked(U.ctx.slot); render(); break; }
    case "changeplan": openSheet({mode:"changeplan",cp:s.plan}); break;
    case "saveplan": s.plan=U.ctx.cp; save(); closeSheet(); render();
      toast(s.status==="trialing"?`Plan changed. First charge of ${PR(s.plan).charge} on ${fmt(chargeT())}.`:`Plan changed. ${PR(s.plan).charge} from your renewal on ${fmt(s.nextCharge)}.`); break;
    case "cancel": openSheet({mode:"cancel",step:"reason",reason:null}); break;
    case "cancelnext": U.ctx.step="confirm"; paintSheet(); break;
    case "cancelback": U.ctx.step="reason"; paintSheet(); break;
    case "confirmcancel": { const until=s.status==="trialing"?chargeT():s.nextCharge; s.accessUntil=until; s.status="cancelled"; save(); closeSheet(); render(); toast(`Cancelled. You have full access until ${fmt(until-DAY)}.`); break; }
    case "toannual": s.plan="annual"; save(); closeSheet(); render(); toast(s.status==="trialing"?`Switched to annual. ${PR("annual").charge} on ${fmt(chargeT())}.`:`Switched to annual from your renewal on ${fmt(s.nextCharge)}.`); break;
    case "resume": s.status=s.nextCharge?"active":"trialing"; delete s.accessUntil; save(); render(); toast("Your plan continues. Welcome back."); break;
    case "updatepay": U.payMode="update"; U.payFrom=U.view; U.payMethod=s.method; go("paywall"); break;
    case "startsub": closeSheet(); U.payMode=trialUsed()?"subscribe":"trial"; U.payFrom=U.view; U.payPlan="monthly"; go("paywall"); break;
    case "invoice": toast(`In the full app, this downloads the ${CT().invoice} as a PDF.`); break;
    case "support": toast("In the full app, this opens a WhatsApp chat with Rasoi support."); break;
    case "logout": P.loggedIn=false; save(); go("landing"); toast("You’re logged out."); break;
    case "delete": openSheet({mode:"delete"}); break;
    case "confirmdelete": P=fresh(); save(); closeSheet(); U.email=""; go("landing"); toast("Your account and data have been deleted."); break;
    case "demo": openSheet({mode:"demo"}); break;
    case "reset": P=fresh(); save(); clearFilters(); U.email=""; U.lib.sort="rec"; closeSheet(); go("landing"); toast("Prototype reset."); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(U.view==="admin"&&adminInput(t)) return;
  if(t.id==="email"){ U.email=t.value.trim(); $("#emailErr").hidden=true; }
  else if(t.id==="waPhone"){ t.value=t.value.replace(/\D/g,"").slice(0,CT().len); const er=$("#waErr"); if(er) er.hidden=true; }
  else if(t.id==="waCode"){ t.value=t.value.replace(/\D/g,"").slice(0,6); const er=$("#waCodeErr"); if(er) er.hidden=true; if(t.value.length===6){ const b=sheetBody.querySelector('[data-act="verifywa"]'); if(b) b.click(); } }
  else if(t.id==="onbName"){ A().name=t.value; $("#nameErr").hidden=true; }
  else if(t.id==="cookName"){ tgt().cookName=t.value; if(U.view==="onb") save(); }
  else if(t.id==="cookPhone"){ t.value=t.value.replace(/\D/g,"").slice(0,CO(tgt()).len); tgt().cookPhone=t.value; if(U.view==="onb") save(); }
  else if(t.id==="libq"){ U.lib.q=t.value; const r=$("#libResults"); if(r) r.innerHTML=libResultsHTML(); }
  else if(t.id==="upiId"||t.id==="cardNo"||t.id==="cardExp"||t.id==="cardCvv"){ const er=$("#payErr"); if(er) er.hidden=true; }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(U.view==="admin"&&adminChange(t)) return;
  if(t.matches("[data-country]")){
    const v=t.value;
    if(U.view==="household"){ const h=U.hh; h.country=v; if(!PLANS.some(p=>p.id===h.plan&&p.cc.includes(v))) h.plan=firstPlan(v); const ok=avoidList(v).map(x=>x[0]); h.avoid=h.avoid.filter(x=>ok.includes(x)); if(h.cookPhone&&h.cookPhone.length!==CO(h).len) h.cookPhone=""; }
    else { U.country=v; }
    rerender(); return;
  }
  if(t.matches("[data-sort]")){ U.lib.sort=t.value; const r=$("#libResults"); if(r) r.innerHTML=libResultsHTML(); const s2=$("[data-sort]"); if(s2) s2.focus(); return; }
  const k=t.dataset&&t.dataset.ing; if(!k) return;
  const hk=`${planId()}|${k}`; if(t.checked) P.have[hk]=true; else delete P.have[hk];
  save(); rerender();
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const id=e.target&&e.target.id;
  if(id==="email"){ e.preventDefault(); const b=$('[data-act="sendlink"]'); if(b) b.click(); }
  else if(id==="waPhone"){ e.preventDefault(); const b=sheetBody.querySelector('[data-act="sendwacode"]'); if(b) b.click(); }
  else if(id==="onbName"){ e.preventDefault(); $('[data-act="onbnext"]').click(); }
  else if(id==="upiId"){ e.preventDefault(); const b=sheetBody.querySelector('[data-act="approve"]'); if(b) b.click(); }
});
sheet.addEventListener("click",e=>{ if(e.target===sheet) closeSheet(); });

try{ window.addEventListener("hashchange",()=>{ if(location.hash==="#admin"){ U.view="admin"; render(); } }); }catch(e){}
render();
</script>
</body>
</html>
